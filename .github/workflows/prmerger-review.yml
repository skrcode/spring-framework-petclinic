# managed-by: prmerger-github-app
name: PRMerger Review

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:
    inputs:
      pull_request_url:
        description: GitHub pull request URL to review
        required: true
        type: string
      pull_request_number:
        description: Pull request number to checkout
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  id-token: write

concurrency:
  group: prmerger-review-${{ github.event_name == 'workflow_dispatch' && inputs.pull_request_number || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/pull/{0}/head', inputs.pull_request_number) || github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build prmerger CLI
        shell: bash
        env:
          PRMERGER_CLI_REPOSITORY_URL: https://github.com/JAIPilot/prmerger.git
          PRMERGER_CLI_REPOSITORY_REF: main
        run: |
          set -euo pipefail
          CLI_DIR="$RUNNER_TEMP/prmerger-cli"
          rm -rf "$CLI_DIR"
          git clone --depth 1 --branch "$PRMERGER_CLI_REPOSITORY_REF" "$PRMERGER_CLI_REPOSITORY_URL" "$CLI_DIR"
          "$CLI_DIR/prmerger" --help >/dev/null

      - name: Run prmerger review
        shell: bash
        env:
          PR_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.pull_request_url || github.event.pull_request.html_url }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/prmerger-cli/prmerger" review "$PR_URL" --output-json prmerger-review.json | tee prmerger-review.txt

      - name: Add review to job summary
        if: ${{ always() }}
        shell: bash
        run: |
          {
            echo "## PRMerger Review"
            echo ""
            if [ -f prmerger-review.json ] && [ "$(jq -r '.reviewReport // empty' prmerger-review.json)" != "" ]; then
              echo '```text'
              jq -r '.reviewReport' prmerger-review.json
              echo '```'
            elif [ -f prmerger-review.txt ]; then
              echo '```text'
              cat prmerger-review.txt
              echo '```'
            else
              echo "Review output was not generated."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Exchange GitHub OIDC token for PRMerger publish token
        if: ${{ always() }}
        id: prmerger-auth
        shell: bash
        env:
          PRMERGER_TOKEN_ENDPOINT: https://otxfylhjrlaesjagfhfi.supabase.co/functions/v1/github-actions-token
          PRMERGER_OIDC_AUDIENCE: jaipilot-github-app
        run: |
          set -euo pipefail

          if ! command -v jq >/dev/null 2>&1; then
            echo "jq is required but missing on the runner." >&2
            exit 1
          fi

          oidc_response="$(curl -fsSL \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${PRMERGER_OIDC_AUDIENCE}")"
          github_oidc_token="$(echo "$oidc_response" | jq -r '.value')"

          if [ -z "$github_oidc_token" ] || [ "$github_oidc_token" = "null" ]; then
            echo "Failed to obtain GitHub OIDC token." >&2
            echo "Response: $oidc_response" >&2
            exit 1
          fi

          exchange_payload="$(jq -cn \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg repository_id "${GITHUB_REPOSITORY_ID}" \
            --arg repository_owner "${GITHUB_REPOSITORY_OWNER}" \
            --arg run_id "${GITHUB_RUN_ID}" \
            --arg run_attempt "${GITHUB_RUN_ATTEMPT}" \
            --arg actor "${GITHUB_ACTOR}" \
            '{repository: $repository, repository_id: $repository_id, repository_owner: $repository_owner, run_id: $run_id, run_attempt: $run_attempt, actor: $actor}')"

          token_response="$(curl -fsSL -X POST "$PRMERGER_TOKEN_ENDPOINT" \
            -H "Authorization: Bearer ${github_oidc_token}" \
            -H "Content-Type: application/json" \
            -d "$exchange_payload")"

          prmerger_publish_token="$(echo "$token_response" | jq -r '.jaipilot_token')"
          expires_at="$(echo "$token_response" | jq -r '.expires_at')"

          if [ -z "$prmerger_publish_token" ] || [ "$prmerger_publish_token" = "null" ]; then
            echo "Token exchange failed." >&2
            echo "Response: $token_response" >&2
            exit 1
          fi

          echo "::add-mask::$prmerger_publish_token"
          echo "prmerger_publish_token=$prmerger_publish_token" >> "$GITHUB_OUTPUT"
          echo "prmerger_publish_token_expires_at=$expires_at" >> "$GITHUB_OUTPUT"

      - name: Publish review on pull request
        if: ${{ always() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PRMERGER_REVIEW_PUBLISH_ENDPOINT: https://otxfylhjrlaesjagfhfi.supabase.co/functions/v1/publish-prmerger-review
          PRMERGER_PUBLISH_TOKEN: ${{ steps.prmerger-auth.outputs.prmerger_publish_token }}
          PR_NUMBER: ${{ github.event_name == 'workflow_dispatch' && inputs.pull_request_number || github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ ! -f prmerger-review.json ]; then
            echo "No structured prmerger review output available to publish."
            exit 0
          fi
          REVIEW_PAYLOAD_FILE="$RUNNER_TEMP/prmerger-review-payload.json"
          export REVIEW_PAYLOAD_FILE
          python3 <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          repo = os.environ["GITHUB_REPOSITORY"]
          pr_number = os.environ["PR_NUMBER"]
          run_url = f"{os.environ['GITHUB_SERVER_URL']}/{repo}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          review = json.loads(Path("prmerger-review.json").read_text(encoding="utf-8"))
          files_pages = json.loads(subprocess.check_output([
              "gh",
              "api",
              "--paginate",
              "--slurp",
              f"repos/{repo}/pulls/{pr_number}/files?per_page=100",
          ], text=True))
          files = []
          for page in files_pages:
              if isinstance(page, list):
                  files.extend(page)
              else:
                  files.append(page)
          head_sha = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()

          def build_positions(patch: str):
              left = {}
              right = {}
              position = 0
              old_line = None
              new_line = None
              for raw_line in patch.splitlines():
                  if raw_line.startswith("@@"):
                      match = re.match(r"@@ -(\d+)(?:,\d+)? \+(\d+)(?:,\d+)? @@", raw_line)
                      if not match:
                          old_line = None
                          new_line = None
                          continue
                      old_line = int(match.group(1))
                      new_line = int(match.group(2))
                      continue
                  if old_line is None or new_line is None:
                      continue
                  position += 1
                  if raw_line.startswith("+") and not raw_line.startswith("+++"):
                      right.setdefault(new_line, position)
                      new_line += 1
                  elif raw_line.startswith("-") and not raw_line.startswith("---"):
                      left.setdefault(old_line, position)
                      old_line += 1
                  else:
                      left.setdefault(old_line, position)
                      right.setdefault(new_line, position)
                      old_line += 1
                      new_line += 1
              return left, right

          file_map = {}
          for item in files:
              patch = item.get("patch") or ""
              left, right = build_positions(patch)
              entry = {
                  "left": left,
                  "right": right,
                  "status": item.get("status"),
              }
              file_map[item["filename"]] = entry
              previous_filename = item.get("previous_filename")
              if previous_filename and previous_filename not in file_map:
                  file_map[previous_filename] = entry

          def format_comment(finding):
              severity = str(finding.get("severity") or "comment").upper()
              title = str(finding.get("title") or "Finding").strip()
              explanation = str(finding.get("explanation") or "").strip()
              return f"**PRMerger [{severity}]** {title}\n\n{explanation}"

          comments = []
          unanchored = []
          for finding in review.get("findings") or []:
              path = str(finding.get("path") or "").strip()
              line = finding.get("line")
              if not path or not isinstance(line, int):
                  unanchored.append(finding)
                  continue
              file_entry = file_map.get(path)
              if not file_entry:
                  unanchored.append(finding)
                  continue
              position = file_entry["right"].get(line)
              if position is None:
                  position = file_entry["left"].get(line)
              if position is None:
                  unanchored.append(finding)
                  continue
              comments.append({
                  "path": path,
                  "position": position,
                  "body": format_comment(finding),
              })

          review_report = str(review.get("reviewReport") or "").strip()
          body_lines = ["## PRMerger Review", "", "Automated by PRMerger.", "", f"Run: {run_url}"]
          if review_report:
              body_lines.extend(["", review_report])
          if unanchored:
              body_lines.extend(["", "UNANCHORED_FINDINGS:"])
              for finding in unanchored:
                  severity = str(finding.get("severity") or "comment").strip()
                  path = str(finding.get("path") or "unknown").strip()
                  line = finding.get("line")
                  title = str(finding.get("title") or "Finding").strip()
                  explanation = str(finding.get("explanation") or "").strip()
                  anchor = f"{path}:{line}" if isinstance(line, int) else path
                  body_lines.append(f"- [{severity}] {anchor} {title} - {explanation}")

          payload = {
              "body": "\n".join(body_lines).strip(),
              "event": "COMMENT",
              "commit_id": head_sha,
          }
          verdict = str(review.get("verdict") or "").strip().lower()
          if verdict == "approve":
              payload["event"] = "APPROVE"
          elif verdict == "changes_requested":
              payload["event"] = "REQUEST_CHANGES"
          if comments:
              payload["comments"] = comments

          Path(os.environ["REVIEW_PAYLOAD_FILE"]).write_text(
              json.dumps(payload),
              encoding="utf-8",
          )
          print(f"Prepared {len(comments)} inline comment(s); {len(unanchored)} unanchored finding(s).")
          PY
          if [ -z "${PRMERGER_PUBLISH_TOKEN}" ]; then
            echo "Missing PRMerger publish token." >&2
            exit 1
          fi
          publish_request="$(jq -cn \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg pull_request_number "${PR_NUMBER}" \
            --slurpfile review "$REVIEW_PAYLOAD_FILE" \
            '{repository: $repository, pull_request_number: $pull_request_number, review: $review[0]}')"
          publish_response="$(curl -fsSL -X POST "$PRMERGER_REVIEW_PUBLISH_ENDPOINT" \
            -H "Authorization: Bearer ${PRMERGER_PUBLISH_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$publish_request")"
          review_author="$(echo "$publish_response" | jq -r '.author // empty')"
          if [ -n "$review_author" ]; then
            echo "Published PRMerger review as $review_author."
          fi

      - name: Upload review artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: prmerger-review
          path: |
            prmerger-review.txt
            prmerger-review.json
          if-no-files-found: ignore
