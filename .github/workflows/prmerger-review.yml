# managed-by: prmerger-github-app
name: prmerger Review

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:
    inputs:
      pull_request_url:
        description: GitHub pull request URL to review
        required: true
        type: string
      pull_request_number:
        description: Pull request number to checkout
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: prmerger-review-${{ github.event_name == 'workflow_dispatch' && inputs.pull_request_number || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/pull/{0}/head', inputs.pull_request_number) || github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build prmerger CLI
        shell: bash
        env:
          PRMERGER_CLI_REPOSITORY_URL: https://github.com/JAIPilot/prmerger.git
          PRMERGER_CLI_REPOSITORY_REF: main
        run: |
          set -euo pipefail
          CLI_DIR="$RUNNER_TEMP/prmerger-cli"
          rm -rf "$CLI_DIR"
          git clone --depth 1 --branch "$PRMERGER_CLI_REPOSITORY_REF" "$PRMERGER_CLI_REPOSITORY_URL" "$CLI_DIR"
          "$CLI_DIR/prmerger" --help >/dev/null

      - name: Run prmerger review
        shell: bash
        env:
          PR_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.pull_request_url || github.event.pull_request.html_url }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/prmerger-cli/prmerger" review "$PR_URL" | tee prmerger-review.txt

      - name: Add review to job summary
        if: ${{ always() }}
        shell: bash
        run: |
          {
            echo "## prmerger review"
            echo ""
            if [ -f prmerger-review.txt ]; then
              echo '```text'
              cat prmerger-review.txt
              echo '```'
            else
              echo "Review output was not generated."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish review on pull request
        if: ${{ always() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event_name == 'workflow_dispatch' && inputs.pull_request_number || github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ ! -f prmerger-review.txt ]; then
            echo "No prmerger review output available to publish."
            exit 0
          fi
          REVIEW_BODY_FILE="$RUNNER_TEMP/prmerger-review-body.md"
          {
            echo "## prmerger review"
            echo ""
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo ""
            echo '```text'
            cat prmerger-review.txt
            echo '```'
          } > "$REVIEW_BODY_FILE"
          VERDICT="$(sed -n 's/^VERDICT: //p' prmerger-review.txt | head -n 1 | tr '[:upper:]' '[:lower:]')"
          REVIEW_EVENT="COMMENT"
          case "$VERDICT" in
            approve) REVIEW_EVENT="APPROVE" ;;
            changes_requested) REVIEW_EVENT="REQUEST_CHANGES" ;;
            comment) REVIEW_EVENT="COMMENT" ;;
          esac
          jq -n --rawfile body "$REVIEW_BODY_FILE" --arg event "$REVIEW_EVENT" '{body: $body, event: $event}' | gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/reviews" --method POST --input - >/dev/null

      - name: Upload review artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: prmerger-review
          path: prmerger-review.txt
          if-no-files-found: ignore
