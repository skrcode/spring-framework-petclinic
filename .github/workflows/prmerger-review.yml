# managed-by: prmerger-github-app
name: prmerger Review

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:
    inputs:
      pull_request_url:
        description: GitHub pull request URL to review
        required: true
        type: string
      pull_request_number:
        description: Pull request number to checkout
        required: true
        type: string

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: prmerger-review-${{ github.event_name == 'workflow_dispatch' && inputs.pull_request_number || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/pull/{0}/head', inputs.pull_request_number) || github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build prmerger CLI
        shell: bash
        env:
          PRMERGER_CLI_REPOSITORY_URL: https://github.com/JAIPilot/prmerger.git
          PRMERGER_CLI_REPOSITORY_REF: main
        run: |
          set -euo pipefail
          CLI_DIR="$RUNNER_TEMP/prmerger-cli"
          rm -rf "$CLI_DIR"
          git clone --depth 1 --branch "$PRMERGER_CLI_REPOSITORY_REF" "$PRMERGER_CLI_REPOSITORY_URL" "$CLI_DIR"
          "$CLI_DIR/prmerger" --help >/dev/null

      - name: Run prmerger review
        shell: bash
        env:
          PR_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.pull_request_url || github.event.pull_request.html_url }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/prmerger-cli/prmerger" review "$PR_URL" | tee prmerger-review.txt

      - name: Add review to job summary
        if: ${{ always() }}
        shell: bash
        run: |
          {
            echo "## prmerger review"
            echo ""
            if [ -f prmerger-review.txt ]; then
              echo '```text'
              cat prmerger-review.txt
              echo '```'
            else
              echo "Review output was not generated."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish review on pull request
        if: ${{ always() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event_name == 'workflow_dispatch' && inputs.pull_request_number || github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ ! -f prmerger-review.txt ]; then
            echo "No prmerger review output available to publish."
            exit 0
          fi
          COMMENT_FILE="$RUNNER_TEMP/prmerger-comment.md"
          {
            echo "<!-- prmerger-review-comment -->"
            echo "## prmerger review"
            echo ""
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo ""
            echo '```text'
            cat prmerger-review.txt
            echo '```'
          } > "$COMMENT_FILE"
          COMMENTS_JSON="$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments?per_page=100")"
          COMMENT_ID="$(printf '%s' "$COMMENTS_JSON" | jq -r 'map(select(.body | contains("<!-- prmerger-review-comment -->"))) | last | .id // empty')"
          if [ -n "$COMMENT_ID" ]; then
            jq -Rs '{body: .}' < "$COMMENT_FILE" | gh api "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID" --method PATCH --input - >/dev/null
          else
            jq -Rs '{body: .}' < "$COMMENT_FILE" | gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --method POST --input - >/dev/null
          fi

      - name: Upload review artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: prmerger-review
          path: prmerger-review.txt
          if-no-files-found: ignore
